[package]
name = "bookshare"
version = "0.1.0"
edition = "2021"
description = "Book Share: Quick Share propio de BookOS (enviar y recibir con Android en la red local)"
license = "MIT"

[dependencies]
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
libaes = "0.7"
p256 = { version = "0.13", features = ["ecdh"] }
prost = "0.13"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[build-dependencies]
prost-build = "0.13"

[[bin]]
name = "bookos-bookshare"
path = "src/main.rs"
